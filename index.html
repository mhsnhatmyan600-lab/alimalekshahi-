<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>علی ملک شاهی</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: Tahoma, 'Segoe UI', sans-serif;
    background: #1a1a1a;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .card {
    background: #2b2b2b;
    border-radius: 20px;
    padding: 40px 30px;
    max-width: 500px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border: 1px solid #3d3d3d;
  }
  .avatar {
    width: 90px;
    height: 90px;
    background: linear-gradient(135deg, #555, #333);
    border-radius: 50%;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    border: 3px solid #4a4a4a;
  }
  h1 {
    color: #ffffff;
    font-size: 26px;
    margin-bottom: 10px;
  }
  .line {
    width: 60px;
    height: 3px;
    background: #666;
    margin: 15px auto 25px;
    border-radius: 2px;
  }
  p {
    color: #b0b0b0;
    line-height: 2;
    font-size: 16px;
  }
  .tags {
    margin-top: 25px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .tag {
    background: #3a3a3a;
    color: #d0d0d0;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    border: 1px solid #4a4a4a;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">⚽</div>
    <h1>علی ملک شاهی</h1>
    <div class="line"></div>
    <p>
      من علی ملک شاهی هستم،<br>
      عاشق فوتبال و دنیای بازی،<br>
      و علاقه‌مند به ورزش.<br>
      عاشق غذاهای فست‌فودی هم هستم 🍔
    </p>
    <div class="tags">
      <span class="tag">⚽ فوتبال</span>
      <span class="tag">🎮 گیمینگ</span>
      <span class="tag">🏃 ورزش</span>
      <span class="tag">🍕 فست‌فود</span>
    </div>
  </div>
</body>
</html>
